        <button id="wa-send-btn" type="button" class="w-full sm:w-auto px-7 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm transition-colors shadow-sm inline-flex items-center justify-center gap-2">

  <footer class="py-6 text-center text-xs text-stone-400">
    © 2026 خالد علاء
  </footer>

  <script>
    const REELS = [
      {
        title: 'عمل 1',
        url: 'https://www.facebook.com/reel/1082055234189345'
      },
      {
        title: 'عمل 2',
        url: 'https://www.facebook.com/reel/1067235885679957'
      },
      {
        title: 'عمل 3',
        url: 'https://www.facebook.com/reel/1054005513677448'
      },
      {
        title: 'عمل 4',
        url: 'https://www.facebook.com/reel/901439199426953'
      }
    ];

    const WA_NUMBER = '201019928852';

    function buildFacebookEmbed(reelUrl) {
      return 'https://www.facebook.com/plugins/video.php?href=' +
        encodeURIComponent(reelUrl) +
        '&show_text=false&width=360&t=0';
    }

    function renderReels() {
      const grid = document.getElementById('reels-grid');
      grid.innerHTML = '';

      REELS.forEach((reel) => {
        const card = document.createElement('article');
        card.className = 'reel-bubble soft-card rounded-3xl p-3 flex flex-col gap-3';

        const frame = document.createElement('div');
        frame.className = 'reel-frame';

        const iframe = document.createElement('iframe');
        iframe.src = buildFacebookEmbed(reel.url);
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        iframe.loading = 'lazy';
        iframe.title = reel.title;

        frame.appendChild(iframe);

        const footer = document.createElement('div');
        footer.className = 'flex items-center justify-between px-1 pb-0.5';

        const title = document.createElement('span');
        title.className = 'font-bold text-stone-800 text-sm';
        title.textContent = reel.title;

        const link = document.createElement('a');
        link.href = reel.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'text-xs font-semibold text-teal-700 hover:text-teal-900 transition-colors';
        link.textContent = 'فتح على فيسبوك ↗';

        footer.appendChild(title);
        footer.appendChild(link);

        card.appendChild(frame);
        card.appendChild(footer);
        grid.appendChild(card);
      });
    }

    document.getElementById('wa-send-btn').addEventListener('click', () => {
      const msg = document.getElementById('wa-message').value.trim() || 'مرحباً خالد، حابب أتواصل معاك بخصوص مشروع مونتاج.';
      const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    });

    renderReels();
  </script>
</body>
